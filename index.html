<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="メダル収支"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><title>メダル収支帳</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;color:#e5e7eb;background:#0b1020}*{box-sizing:border-box}body{margin:0;padding:20px 14px 80px}.wrap{max-width:650px;margin:auto}h1{font-size:24px;margin:8px 0 20px}h2{font-size:17px;margin:0 0 15px}.card{background:#192237;border:1px solid #2e3b55;border-radius:18px;padding:18px;margin-bottom:15px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:#11192b;border-radius:13px;padding:14px}.stat small{color:#aab4c6}.stat strong{display:block;font-size:23px;margin-top:8px;word-break:break-all}.pos{color:#4ade80}.neg{color:#fb7185}label{display:block;font-size:13px;color:#cbd5e1;margin:12px 0 6px}input{width:100%;padding:13px;border-radius:11px;border:1px solid #536079;background:#0f172a;color:white;font-size:18px;min-width:0}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}button,.file{border:0;border-radius:11px;padding:12px 16px;background:#64748b;color:white;font-weight:700;font-size:15px;cursor:pointer}button.primary{background:#4f46e5;width:100%;margin-top:16px}.result{font-size:21px;font-weight:700;margin-top:16px;text-align:right}.muted{color:#aab4c6;font-size:13px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.entry{border-top:1px solid #334155;padding:13px 0}.entry:first-child{border:0}.entry .muted{margin-top:5px}.entry button{font-size:12px;padding:8px;background:#374151}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar button{font-size:13px}canvas{width:100%;height:240px;display:block}.notice{font-size:12px;line-height:1.7;color:#aab4c6}.empty{text-align:center;color:#94a3b8;padding:18px}.hidden{display:none}#importFile{display:none}#entryForm{min-width:0;max-width:100%}#date{display:block;width:100%;max-width:100%;min-width:0;box-sizing:border-box;-webkit-appearance:none;appearance:none;font-size:16px;overflow:hidden} .two>div{min-width:0}</style></head><body><main class="wrap"><h1>🪙 メダル収支帳</h1><section class="card"><div class="stats"><div class="stat"><small>累計収支</small><strong id="total">0枚</strong></div><div class="stat"><small>今月の収支</small><strong id="monthly">0枚</strong></div><div class="stat"><small>記録回数</small><strong id="count">0回</strong></div><div class="stat"><small>プラスの割合</small><strong id="winrate">—</strong></div></div></section><section class="card"><h2 id="formTitle">新しい記録</h2><form id="entryForm"><label for="date">日付</label><input type="date" id="date" required><div class="two"><div><label for="invest">投入枚数</label><input type="number" id="invest" min="0" step="1" placeholder="500" inputmode="numeric" required></div><div><label for="payout">最終獲得枚数</label><input type="number" id="payout" min="0" step="1" placeholder="800" inputmode="numeric" required></div></div><div class="result" id="preview">収支：—</div><button class="primary" id="saveButton">記録を保存</button><button type="button" id="cancelEdit" class="hidden" style="margin-top:8px;width:100%">編集をキャンセル</button></form></section><section class="card"><h2>累計収支グラフ</h2><canvas id="chart" aria-label="累計収支の推移"></canvas><div class="muted" id="chartNote"></div></section><section class="card"><div class="row"><h2>記録履歴</h2><select id="filter" aria-label="履歴の表示期間" style="background:#0f172a;color:white;padding:9px;border-radius:8px;border:1px solid #536079"><option value="all">すべて</option><option value="month">今月</option></select></div><div id="history"></div></section><section class="card"><h2>バックアップ</h2><div class="toolbar"><button id="exportCsv">CSV出力</button><button id="exportJson">バックアップ保存</button><button id="importBtn">バックアップ復元</button><input type="file" id="importFile" accept=".json,application/json"></div><p class="notice">記録はこの端末のブラウザ内に保存されます。Safariのデータ削除・端末変更などで消える場合があります。定期的に「バックアップ保存」し、iCloud Drive等に保管してください。復元時は現在の記録を置き換えます。</p></section></main><script src="app.js" defer></script></body></html>
